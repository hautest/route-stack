name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # npm provenance needs a public repository: skipped while it is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: it writes an _authToken from an empty NODE_AUTH_TOKEN
      # into .npmrc, and npm then skips the trusted-publishing (OIDC) exchange
      # and publishes unauthenticated (E404).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # With changesets pending: opens or updates a "Version Packages" PR.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With none (that PR merged): publishes the version unless it is on npm.
      # The npm CLI, not `changeset publish`: in a pnpm workspace that publishes
      # through pnpm, which does not do npm's trusted-publishing (OIDC) exchange.
      - id: version
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./packages/route-stack/package.json').version")
          echo "tag=route-stack@$version" >> "$GITHUB_OUTPUT"
          if npm view "route-stack@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.tag && !steps.version.outputs.published
        run: pnpm -C packages/route-stack build
      - if: steps.version.outputs.tag && !steps.version.outputs.published
        working-directory: packages/route-stack
        run: npm publish --provenance --access public
      - if: steps.version.outputs.tag && !steps.version.outputs.published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          # This version's section of the changelog, as the release notes.
          awk -v v="## ${TAG#route-stack@}" '$0 == v { on = 1; next } /^## / { on = 0 } on' \
            packages/route-stack/CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
