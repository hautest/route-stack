name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # npm provenance needs a public repository: skipped while it is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: it writes an _authToken from an empty NODE_AUTH_TOKEN
      # into .npmrc, and npm then skips the trusted-publishing (OIDC) exchange
      # and publishes unauthenticated (E404).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later (scripts/release.mjs).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # With changesets pending: opens or updates a "Version Packages" PR.
      # When that PR is merged: builds and publishes to npm with provenance,
      # through npm trusted publishing (no token), then tags and releases it.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
