name: CI

# Pull requests from outside contributors wait for a maintainer's approval
# before they run (Settings > Actions > General: all outside contributors).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps and the docs type-check against the built package.
      - run: pnpm -C packages/route-stack build
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    # macOS: Linux's WebKit build differs from Safari's (its Navigation API
    # among others), and the WebKit tests stand for iOS WebViews.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests run in Chromium and WebKit (the engine of iOS WebViews).
      - run: pnpm -C packages/route-stack exec playwright install chromium webkit
      - run: pnpm -C packages/route-stack test
