name: CI

# Pull requests from outside contributors wait for a maintainer's approval
# before they run (Settings > Actions > General: all outside contributors).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps and the docs type-check against the built package.
      - run: pnpm -C packages/route-stack build
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # A job per browser: the WebKit tests need a page per file (below), and
  # the Chromium ones then run without the extra workers, whose load made
  # their mid-slide checks miss the slide.
  test:
    name: test (${{ matrix.name }})
    # macOS: Linux's WebKit build differs from Safari's (its Navigation API
    # among others), and the WebKit tests stand for iOS WebViews.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browser: chromium
            args: --project unit --project "browser (chromium)" --project "browser-basepath*"
          - name: webkit
            browser: webkit
            # A page per file: WebKit allows a page 100 history writes per 10
            # seconds, and files sharing a page go past it.
            args: --project "browser (webkit)" --maxWorkers=7
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/route-stack exec playwright install ${{ matrix.browser }}
      - run: pnpm -C packages/route-stack exec vitest run ${{ matrix.args }}
